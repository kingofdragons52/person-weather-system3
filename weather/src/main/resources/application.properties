eureka.client.service-url.defaultZone=http://localhost:8761/eureka
server.port=8082
spring.cache.caffeine.spec=expireAfterWrite=60s
appid=a3198c00d233c295d46bf68a12d0f2b3
management.endpoints.web.exposure.include=health, caches
management.endpoint.health.show-details=always
management.endpoint.caches.enabled=true
logging.level.org.springframework.web=DEBUG
logging.level.com.example.location=DEBUG

spring.application.name=weather-service

# H2 Database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console